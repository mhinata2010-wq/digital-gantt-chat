<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#208965">
  <title>工程表 | snake site</title>
  <meta name="description" content="工程を並べ、日付を決め、ひとつの工程表をつくる試作です。">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="design.css">
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <symbol id="icon-schedule" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.3"/><path d="M12 3.7v8.5h7.9M12 12.2l-3.5 3.4"/></symbol>
    <symbol id="icon-home" viewBox="0 0 24 24"><path d="m3.5 10.2 8.5-7 8.5 7v9a1.3 1.3 0 0 1-1.3 1.3H4.8a1.3 1.3 0 0 1-1.3-1.3zM9 20.5v-7h6v7"/></symbol>
    <symbol id="icon-person" viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="3.2"/><path d="M5.5 20v-1.6c0-3 2.6-5 6.5-5s6.5 2 6.5 5V20"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
  </svg>
  <nav class="mobile-nav" aria-label="画面の切り替え">
    <button type="button" data-view-button="schedule" aria-label="工程表を見る" title="工程表"><svg aria-hidden="true"><use href="#icon-schedule"/></svg><small>工程表</small></button>
    <button type="button" data-view-button="home" aria-label="ホームを見る" title="ホーム"><svg aria-hidden="true"><use href="#icon-home"/></svg><small>ホーム</small></button>
    <button type="button" data-view-button="settings" aria-label="工程表の設定" title="設定"><svg aria-hidden="true"><use href="#icon-person"/></svg><small>設定</small></button>
  </nav>
  <header class="topbar">
    <div class="brand" aria-label="snake site 工程表"><span class="brand-symbol" aria-hidden="true"></span><span class="brand-word" aria-hidden="true"><strong>snake</strong><small>site</small></span><span class="division">工程表</span></div>
    <button id="print" class="quiet print-action" type="button">印刷・PDF</button>
  </header>
  <main>
    <section class="mobile-home" id="mobileHome" aria-label="現場のホーム">
      <span class="eyebrow">今日の現場</span>
      <button type="button" class="home-card" id="openSchedule"><span>前回開いた工程表</span><strong id="homeProjectName">サンプル工事</strong><span class="card-footer"><span id="homePeriod">予定を確認する</span><svg aria-hidden="true"><use href="#icon-arrow"/></svg></span></button>
      <div class="home-section-heading"><div><h2>工程表を選ぶ</h2></div><button type="button" id="homeAddTask">＋ 新しい工程表</button></div>
      <div class="home-tasks" id="homeTasks"></div>
      <p class="rotate-tip"><span aria-hidden="true">↻</span> 工程表を選んで、横向きで日程を確認できます。</p>
    </section>
    <div class="page-head">
      <div class="page-name"><span class="eyebrow">工程表 / 試作</span><h1 id="displayName">現場の工程表</h1><p id="projectMeta">工程を追加して予定を組みましょう。</p></div>
      <button class="primary" id="addTask" type="button">＋ 工程を追加</button>
    </div>
    <section class="project-controls" id="projectControls" aria-label="工程表の設定">
      <label>工事名<input id="projectName" maxlength="80" autocomplete="off"></label>
      <label>表示開始日<input id="viewStart" type="date"></label>
      <div class="period-control" aria-label="表示期間"><span>表示期間</span><div class="segmented"><button type="button" data-days="14" aria-pressed="true">2週間</button><button type="button" data-days="28" aria-pressed="false">4週間</button></div></div>
    </section>
    <section class="board" aria-label="ガントチャート">
      <div class="board-toolbar"><div><small class="board-project-name" id="boardProjectName"></small><strong id="periodLabel">工程表</strong><span id="todayLabel"></span></div><div class="board-actions"><button id="prev" type="button" aria-label="前の期間">‹</button><button id="today" type="button">今日</button><button id="next" type="button" aria-label="次の期間">›</button></div></div>
      <div class="board-scroll" id="boardScroll"><div class="board-grid" id="boardGrid"></div></div>
      <div class="board-foot"><span>工程の棒を左右に動かすと開始日を変更できます。</span><span><i class="legend-done"></i>完了　<i class="legend-open"></i>未完了</span></div>
    </section>
    <p class="orientation-hint">↻ 横向きにすると日付と工程を広く見られます。端末の回転ロックが有効な場合は解除してください。</p>
    <div class="below-board"><span id="saveState" role="status">この端末に保存しました</span><div><button id="export" class="text-action" type="button">データを保存</button><label class="text-action file-action">データを読み込む<input id="import" type="file" accept="application/json,.json"></label><button id="newProject" class="text-action" type="button">新しい工程表</button></div></div>
  </main>
  <dialog id="projectDialog" aria-labelledby="projectDialogTitle"><form id="projectForm">
    <div class="dialog-head"><div><span class="eyebrow">現場</span><h2 id="projectDialogTitle">工程表を作成</h2></div><button type="button" id="closeProjectDialog" class="close" aria-label="閉じる">×</button></div>
    <label>工事名<input id="newProjectName" name="projectName" required maxlength="80" placeholder="例：中央通り改修工事"></label>
    <div class="dialog-actions"><span></span><button type="submit" class="primary">工程表を作る</button></div>
  </form></dialog>
  <dialog id="taskDialog" aria-labelledby="dialogTitle"><form id="taskForm">
    <div class="dialog-head"><div><span class="eyebrow">工程</span><h2 id="dialogTitle">工程を追加</h2></div><button type="button" id="closeDialog" class="close" aria-label="閉じる">×</button></div>
    <label>工程名<input name="name" required maxlength="80" placeholder="例：基礎工事"></label>
    <label>担当会社・担当<input name="company" maxlength="80" placeholder="例：基礎業者"></label>
    <div class="dialog-row"><label>開始日<input name="start" type="date" required></label><label>所要日数（暦日）<input name="days" type="number" min="1" max="365" required></label></div>
    <label class="check"><input name="complete" type="checkbox"> 完了した工程</label>
    <div class="dialog-actions"><button id="deleteTask" type="button" class="danger">この工程を削除</button><button type="submit" class="primary">工程表に反映</button></div>
  </form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
