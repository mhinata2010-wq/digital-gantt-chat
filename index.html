<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>現場フロー｜工事工程表</title>
  <meta name="description" content="建設工事の工程作成と遅延影響の再計算を行う工程表">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231b2a3a'/%3E%3Cpath d='M7 10h18M7 16h18M7 22h18' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M11 7v18M21 7v18' stroke='%23ee6a3b' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="appbar"><div class="brand"><span class="brandmark" aria-hidden="true"><i></i><i></i><i></i></span>現場フロー</div><nav class="tabs" aria-label="画面切り替え"><button id="createTab" class="active">工程を作成</button><button id="ganttTab">工程表・遅延調整</button></nav></header>
  <main>
    <section id="createPanel">
      <div class="pagehead"><div><h1>工程表を作成</h1><p>現場情報と工程の前後関係を登録します。</p></div><div class="project-code">NEW SCHEDULE / 01</div></div>
      <div class="panel project-form"><div class="field"><label for="projectName">現場名</label><input id="projectName" value="木造住宅 新築工事"></div><div class="field"><label for="projectStart">工事開始日</label><input id="projectStart" type="date" value="2026-08-01"></div><div class="field"><label for="manager">管理担当者</label><input id="manager" value="現場監督"></div></div>
      <section class="panel editor"><div class="editor-head"><h2 class="section-title"><span class="section-no">1</span>工程を登録</h2><button class="btn" id="addProcess">＋ 工程を追加</button></div><div class="process-head"><span>順番</span><span>工程名</span><span>工種・担当会社</span><span>所要日数</span><span>前提工程（自動）</span><span>稼働不可日</span><span>進捗</span><span></span></div><div id="processList"></div><div class="editor-actions"><p class="editor-note">左のハンドルをドラッグして並べ替えます。上の工程から順に日程へ反映されます。</p><div><button class="btn" id="resetBuilder">初期データ</button> <button class="btn dark" id="generate">工程表を生成</button></div></div></section>
    </section>
    <section id="ganttPanel" class="hidden">
      <div class="pagehead"><div><h1 id="ganttTitle">工事工程表</h1><p id="projectMeta"></p></div><div class="project-code">MASTER SCHEDULE / 01</div></div>
      <div class="gantt-tools"><div class="delay-strip"><strong>遅延を反映</strong><select id="taskSelect" aria-label="遅れが出た工程"></select><input id="delay" type="number" min="1" max="30" value="2" aria-label="遅れ日数"><span>日</span><button class="btn primary" id="simulate"><span class="button-label">変更を反映</span><span class="loading-label">再計算中…</span></button><button class="btn" id="backToEdit">工程を編集</button></div><div class="finish-box"><small>全体完了予定</small><b id="finish"></b></div></div>
      <section class="schedule" id="scheduleBoard"><div class="schedule-head"><h2>全体工程</h2><div class="legend"><span><i class="ghost"></i>変更前</span><span><i class="solid"></i>変更後・影響あり</span></div></div><div class="timeline-scroll"><div id="timeline" class="timeline"></div></div></section>
      <div id="summary" class="result" aria-live="polite"></div><section id="compare" class="comparison"><h2>変更前後の比較</h2><table><thead><tr><th>工程</th><th>変更前</th><th>変更後</th><th>影響</th></tr></thead><tbody id="changes"></tbody></table></section>
    </section>
  </main>
  <script>
    const $=id=>document.getElementById(id), DAY=42, palette=['#2b8b62','#e89419','#17658a','#b3263e','#536e80','#7d5b9c','#367b83'];
    const defaults=[{name:'土木工事',company:'土木業者',days:4,dep:'',blocked:'',status:'完了'},{name:'基礎工事',company:'基礎業者',days:3,dep:'0',blocked:'8/6',status:'進行中'},{name:'躯体工事',company:'大工・建方業者',days:7,dep:'1',blocked:'',status:'未着手'},{name:'電気配線',company:'電気業者',days:4,dep:'2',blocked:'',status:'未着手'},{name:'内装工事',company:'内装業者',days:5,dep:'3',blocked:'',status:'未着手'}];
    let tasks=structuredClone(defaults),base=new Date('2026-08-01T00:00:00'),current=null;
    const add=(date,n)=>{const x=new Date(date);x.setDate(x.getDate()+n);return x},fmt=date=>`${date.getMonth()+1}/${date.getDate()}`,esc=value=>String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function show(view){$('createPanel').classList.toggle('hidden',view!=='create');$('ganttPanel').classList.toggle('hidden',view!=='gantt');$('createTab').classList.toggle('active',view==='create');$('ganttTab').classList.toggle('active',view==='gantt')}
    function normalizeOrder(){tasks.forEach((task,index)=>task.dep=index?String(index-1):'')}
    function builderRow(task,index){const statuses=['未着手','進行中','完了','遅延'].map(s=>`<option ${s===task.status?'selected':''}>${s}</option>`).join(''),dependency=index?tasks[index-1].name:'なし（最初の工程）';return `<div class="process-row" data-index="${index}"><div class="order-cell"><button class="drag-handle" aria-label="${esc(task.name)}を並べ替え" title="ドラッグして並べ替え">↕</button><span class="order">${String(index+1).padStart(2,'0')}</span></div><input data-key="name" aria-label="工程名" value="${esc(task.name)}"><input data-key="company" aria-label="工種・担当会社" value="${esc(task.company)}"><input data-key="days" aria-label="所要日数" type="number" min="1" value="${task.days}"><div class="dependency-auto" title="${esc(dependency)}">${esc(dependency)}</div><input data-key="blocked" aria-label="稼働不可日" placeholder="8/6, 8/10" value="${esc(task.blocked)}"><select data-key="status" aria-label="進捗">${statuses}</select><button class="remove" aria-label="この工程を削除">×</button></div>`}
    function renderBuilder(highlightLast=false){normalizeOrder();$('processList').innerHTML=tasks.map(builderRow).join('');document.querySelectorAll('.process-row').forEach(row=>{const index=Number(row.dataset.index);row.querySelectorAll('[data-key]').forEach(control=>control.addEventListener('change',()=>{tasks[index][control.dataset.key]=control.dataset.key==='days'?Math.max(1,Number(control.value)||1):control.value;renderBuilder()}));row.querySelector('.remove').addEventListener('click',()=>removeTask(index));row.querySelector('.drag-handle').addEventListener('pointerdown',event=>startReorder(event,row))});if(highlightLast){const last=$('processList').lastElementChild;last.classList.add('just-added');last.scrollIntoView({behavior:'smooth',block:'center'})}}
    function animateReflow(list,before){requestAnimationFrame(()=>[...list.children].forEach(row=>{const oldTop=before.get(row);if(oldTop===undefined)return;const delta=oldTop-row.getBoundingClientRect().top;if(delta)row.animate([{transform:`translateY(${delta}px)`},{transform:'translateY(0)'}],{duration:220,easing:'cubic-bezier(.2,.8,.2,1)'})}))}
    function startReorder(event,row){if(event.button!==undefined&&event.button!==0)return;event.preventDefault();const list=$('processList'),rect=row.getBoundingClientRect(),offset=event.clientY-rect.top,ghost=row.cloneNode(true);ghost.classList.add('drag-ghost');ghost.style.left=`${rect.left}px`;ghost.style.top=`${rect.top}px`;ghost.style.width=`${rect.width}px`;document.body.appendChild(ghost);row.classList.add('dragging');const move=e=>{ghost.style.top=`${e.clientY-offset}px`;const before=new Map([...list.children].map(item=>[item,item.getBoundingClientRect().top])),others=[...list.querySelectorAll('.process-row:not(.dragging)')],target=others.find(item=>e.clientY<item.getBoundingClientRect().top+item.offsetHeight/2);if(target&&target!==row.nextElementSibling)list.insertBefore(row,target);else if(!target&&row!==list.lastElementChild)list.appendChild(row);animateReflow(list,before);if(e.clientY<90)window.scrollBy({top:-12});else if(e.clientY>innerHeight-70)window.scrollBy({top:12})};const end=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',end);ghost.remove();row.classList.remove('dragging');const order=[...list.querySelectorAll('.process-row')].map(item=>Number(item.dataset.index)),previous=tasks;tasks=order.map(index=>previous[index]);normalizeOrder();renderBuilder()};document.addEventListener('pointermove',move);document.addEventListener('pointerup',end,{once:true})}
    function removeTask(index){if(tasks.length===1)return;tasks.splice(index,1);normalizeOrder();renderBuilder()}
    function schedule(delayId=-1,extra=0){const result=[];tasks.forEach((task,index)=>{const start=index?add(result[index-1].end,0):new Date(base),days=Number(task.days)+(index===delayId?extra:0);result.push({start,end:add(start,days),days,shift:0})});if(delayId>=0){const original=schedule();result.forEach((item,index)=>item.shift=Math.round((item.start-original[index].start)/864e5))}return result}
    function generateChart(){if(!$('projectStart').value)return;base=new Date(`${$('projectStart').value}T00:00:00`);current=null;$('ganttTitle').textContent=$('projectName').value||'工事工程表';$('projectMeta').textContent=`開始 ${fmt(base)} ・ 管理 ${$('manager').value||'未設定'}`;$('taskSelect').innerHTML=tasks.map((task,index)=>`<option value="${index}">${esc(task.name)}（${esc(task.company)}）</option>`).join('');$('taskSelect').value=String(Math.min(1,tasks.length-1));$('summary').className='result';$('compare').className='comparison';renderTimeline(false);show('gantt')}
    function taskLayout(index){const above=index%2===0,row=Math.floor(index/2);return above?{bar:28+row*67,meta:61+row*67}:{bar:320+row*67,meta:354+row*67}}
    function renderTimeline(animate){const data=current?current.after:schedule(),before=current?current.before:null,lastEnd=Math.max(...data.map(x=>x.end.getTime())),total=Math.max(28,Math.ceil((lastEnd-base)/864e5)+3),width=total*DAY;let html=`<div class="month-label">${base.getFullYear()}年 ${base.getMonth()+1}月</div><div class="axis" style="width:${width}px">`;for(let i=0;i<total;i++){const date=add(base,i),week=['日','月','火','水','木','金','土'][date.getDay()];html+=`<div class="day ${date.getDay()===0||date.getDay()===6?'weekend':''}">${date.getDate()}<small>${week}</small></div>`}html+='</div>';
      tasks.forEach((task,index)=>{const item=data[index],old=before&&before[index],start=Math.round((item.start-base)/864e5),oldStart=old?Math.round((old.start-base)/864e5):start,layout=taskLayout(index),color=palette[index%palette.length],changed=Boolean(current&&(index===current.id||item.shift>0)),barWidth=Math.max(item.days*DAY-5,34),oldWidth=old?Math.max(old.days*DAY-5,34):barWidth,markerTop=layout.bar<232?227:277,connTop=Math.min(layout.bar+15,257),connHeight=Math.abs(247-(layout.bar+15));if(changed&&old)html+=`<div class="oldbar" style="left:${oldStart*DAY+3}px;top:${layout.bar}px;width:${oldWidth}px"></div>`;html+=`<div class="connector" style="--color:${color};left:${start*DAY+11}px;top:${connTop}px;height:${connHeight}px"></div><div class="marker" style="--color:${color};left:${start*DAY+6}px;top:${markerTop}px"></div>`;const motion=animate&&changed?(item.shift>0?'shifted':'expanded'):'initial';html+=`<div class="taskbar ${motion} ${changed?'changed':''}" style="--color:${color};--shift:${item.shift*DAY}px;--old-width:${oldWidth}px;--new-width:${barWidth}px;--delay:${index*.06}s;left:${start*DAY+3}px;top:${layout.bar}px;width:${barWidth}px"><span class="barname">${esc(task.name)}</span><span class="duration">${item.days}日</span></div><div class="taskmeta ${changed?'changed':''}" style="left:${start*DAY+4}px;top:${layout.meta}px">${esc(task.company)}<small>${fmt(item.start)} — ${fmt(item.end)}</small></div>`});$('timeline').style.width=`${width}px`;$('timeline').innerHTML=html;$('finish').textContent=fmt(new Date(lastEnd))}
    function simulate(){const id=Number($('taskSelect').value),days=Math.max(1,Number($('delay').value)||1),button=$('simulate');button.classList.add('processing');$('scheduleBoard').classList.add('updating');setTimeout(()=>{const before=schedule(),after=schedule(id,days);current={id,days,before,after};const affected=tasks.map((task,index)=>({task,index})).filter(({index})=>index!==id&&after[index].shift>0),finishShift=Math.round((Math.max(...after.map(x=>x.end))-Math.max(...before.map(x=>x.end)))/864e5);renderTimeline(true);$('summary').innerHTML=`<strong>日程変更案</strong>「${esc(tasks[id].name)}」の完了が${days}日遅れるため、${affected.length?affected.map(x=>esc(x.task.name)).join('、'):'後続工程なし'}の開始候補を再計算しました。全体の完了予定は<strong style="display:inline">${finishShift}日後ろ倒し</strong>です。`;$('summary').className='result show';$('changes').innerHTML=tasks.map((task,index)=>({task,index})).filter(({index})=>index===id||after[index].shift>0).map(({task,index})=>`<tr><td><b>${esc(task.name)}</b><br><small>${esc(task.company)}</small></td><td>${fmt(before[index].start)}〜${fmt(before[index].end)}</td><td>${fmt(after[index].start)}〜${fmt(after[index].end)}</td><td class="shift">${index===id?`所要日数 +${days}日`:`開始 +${after[index].shift}日`}</td></tr>`).join('');$('compare').className='comparison show';button.classList.remove('processing');setTimeout(()=>$('scheduleBoard').classList.remove('updating'),80)},420)}
    $('createTab').addEventListener('click',()=>show('create'));$('ganttTab').addEventListener('click',generateChart);$('backToEdit').addEventListener('click',()=>show('create'));$('generate').addEventListener('click',generateChart);$('simulate').addEventListener('click',simulate);$('addProcess').addEventListener('click',()=>{tasks.push({name:'新しい工程',company:'担当会社',days:1,dep:tasks.length?String(tasks.length-1):'',blocked:'',status:'未着手'});renderBuilder(true)});$('resetBuilder').addEventListener('click',()=>{tasks=structuredClone(defaults);normalizeOrder();$('projectStart').value='2026-08-01';$('projectName').value='木造住宅 新築工事';$('manager').value='現場監督';renderBuilder()});normalizeOrder();renderBuilder();
  </script>
</body>
</html>
