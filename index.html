<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>現場フロー｜自動再調整ガント</title><meta name="description" content="建設工程の遅延影響を自動で再計算するガントチャート"><style>
:root{--ink:#182235;--muted:#6a7485;--line:#dce2e9;--bg:#f5f7f9;--navy:#18304b;--orange:#ef6b3b;--blue:#2e78c8;--green:#3a9b75;--purple:#8268c5;--yellow:#d7a23d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;font-size:16px}header{background:var(--navy);color:#fff;padding:18px max(20px,calc((100% - 1180px)/2));display:flex;align-items:center;justify-content:space-between}header strong{font-size:20px;letter-spacing:.03em}.badge{font-size:12px;background:#294864;padding:6px 9px;border-radius:99px}main{max-width:1180px;margin:auto;padding:26px 20px 48px}.eyebrow{font-size:13px;font-weight:700;color:#56718c;letter-spacing:.08em}.top{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:20px}.top h1{font-size:28px;margin:5px 0}.top p{margin:0;color:var(--muted);line-height:1.6}.finish{background:#fff;border:1px solid var(--line);padding:14px 18px;border-radius:12px;min-width:186px}.finish b{display:block;font-size:23px;margin-top:4px}.grid{display:grid;grid-template-columns:320px 1fr;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 2px 7px #12223a08}.card h2{font-size:16px;margin:0 0 15px}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:#455164}select,input{width:100%;padding:11px;border:1px solid #cbd4df;border-radius:8px;font-size:16px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{border:0;border-radius:9px;padding:12px 14px;font-weight:700;font-size:15px;cursor:pointer}.primary{background:var(--orange);color:white;width:100%;margin-top:8px}.secondary{background:#eaf0f6;color:#263d55;margin-top:8px;width:100%}.hint{font-size:12px;color:var(--muted);line-height:1.5;margin:12px 0 0}.summary{display:none;background:#fff4ee;border:1px solid #ffcbb7;border-radius:10px;padding:14px;line-height:1.55;margin-top:16px;font-size:14px}.summary.show{display:block}.chart-card{padding:0;overflow:hidden}.chart-head{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;align-items:center}.legend{font-size:12px;color:var(--muted);display:flex;gap:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:2px;background:#b5bdc7;margin-right:4px}.dot.after{background:var(--orange)}.chart-scroll{overflow-x:auto}.chart{min-width:720px}.axis,.task{display:grid;grid-template-columns:190px repeat(24,1fr);min-height:49px;border-bottom:1px solid #edf0f3;position:relative}.axis{min-height:40px;background:#fafbfc}.axis .name{font-size:12px;font-weight:700;color:var(--muted);padding:14px}.day{font-size:11px;color:#6c7786;text-align:center;padding-top:13px;border-left:1px solid #f0f2f5}.task .label{padding:10px 12px;position:relative;z-index:2;background:#fff;border-right:1px solid #e8edf1}.label b{display:block;font-size:14px}.label small{font-size:12px;color:var(--muted)}.bar{grid-row:1;margin:12px 1px;border-radius:5px;z-index:1;min-width:4px;transition:.35s}.bar span{font-size:11px;color:#fff;white-space:nowrap;line-height:25px;padding-left:7px;font-weight:700}.bar.before{opacity:.28;background:#7d8898}.bar.current{background:var(--c)}.bar.affected{box-shadow:0 0 0 2px #ffae8e;background:var(--orange)}.affected-row{background:#fffaf7}.affected-row .label{background:#fffaf7}.status{padding:3px 7px;border-radius:10px;font-size:11px;display:inline-block;margin-top:3px;background:#edf1f5;color:#586574}.compare{margin-top:18px;display:none}.compare.show{display:block}.compare h2{margin:0 0 12px;font-size:18px}.changes{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.changes th,.changes td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:14px}.changes th{background:#f8fafb;color:#596576;font-size:12px}.shift{color:#c34b25;font-weight:700}.empty{color:var(--muted);font-size:14px;margin:0}@media(max-width:800px){main{padding:18px 12px}.top{display:block}.finish{margin-top:15px}.grid{grid-template-columns:1fr}.chart-card{order:-1}.axis,.task{grid-template-columns:160px repeat(24,24px)}header{padding:15px 14px}.legend{display:none}}
</style></head><body><header><strong>現場フロー</strong><span class="badge">試作版　工程案は人が確定</span></header><main><section class="top"><div><div class="eyebrow">工程の遅延影響を見える化</div><h1>自動再調整ガントチャート</h1><p>依存関係をもとに、後続工程の開始候補をルールで再計算します。</p></div><div class="finish"><span style="font-size:13px;color:var(--muted)">完了予定（現在案）</span><b id="finish">7/22</b></div></section><div class="grid"><aside class="card"><h2>1. 遅れを入力する</h2><div class="field"><label>遅れが出た工程</label><select id="taskSelect"></select></div><div class="field"><label>遅れ日数</label><div class="row"><input id="delay" type="number" min="1" max="14" value="2"><div style="padding:11px 0;color:var(--muted)">日</div></div></div><button class="primary" id="simulate">影響を見る</button><button class="secondary" id="reset">初期工程に戻す</button><p class="hint">固定日・担当会社の稼働不可日は、登録時に「開始不可日」として設定する想定です。この試作では依存関係の再計算を検証できます。</p><div id="summary" class="summary"></div></aside><section class="chart-card card"><div class="chart-head"><h2>2. 影響を確認する</h2><div class="legend"><span><i class="dot"></i>変更前</span><span><i class="dot after"></i>影響あり・変更後</span></div></div><div class="chart-scroll"><div class="chart" id="chart"></div></div></section></div><section class="compare" id="compare"><h2>3. 変更候補の比較</h2><table class="changes"><thead><tr><th>工程</th><th>変更前</th><th>変更後の開始候補</th><th>影響</th><th>確認</th></tr></thead><tbody id="changes"></tbody></table><p class="hint">候補日程は、現場監督が協力会社の稼働・天候・資材納入を確認したうえで確定してください。</p></section></main><script>
const base='2026-08-01';const tasks=[{id:'civil',name:'土木工事',company:'土木業者',days:4,dep:null,color:'#3a9b75',status:'完了'},{id:'foundation',name:'基礎工事',company:'基礎業者',days:3,dep:'civil',color:'#2e78c8',status:'進行中'},{id:'frame',name:'躯体工事',company:'大工・建方業者',days:7,dep:'foundation',color:'#8268c5',status:'未着手'},{id:'electric',name:'電気配線',company:'電気業者',days:4,dep:'frame',color:'#d7a23d',status:'未着手'},{id:'interior',name:'内装工事',company:'内装業者',days:5,dep:'electric',color:'#ef6b3b',status:'未着手'}];
const add=(d,n)=>{let x=d instanceof Date?new Date(d):new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return x};const fmt=d=>`${d.getMonth()+1}/${d.getDate()}`;function schedule(delayId=null,extra=0){let out={};tasks.forEach(t=>{let s=t.dep?add(out[t.dep].end,0):new Date(base+'T00:00:00');let duration=t.days+(t.id===delayId?extra:0);out[t.id]={start:s,end:add(s,duration),days:duration,shift:0}});if(delayId){let prev=schedule();tasks.forEach(t=>out[t.id].shift=Math.round((out[t.id].start-prev[t.id].start)/86400000));}return out}let current=null;const initial=schedule();
function render(){let data=current?current.after:initial;let before=current?current.before:null;let dates=Array.from({length:24},(_,i)=>{let d=add(new Date(base+'T00:00:00'),i);return `${fmt(d)}<br><small>${['日','月','火','水','木','金','土'][d.getDay()]}</small>`});let html='<div class="axis"><div class="name">工程 / 担当<br><small>工程開始：8/1（前半2週間：8/1〜8/14）</small></div>'+dates.map(d=>`<div class="day">${d}</div>`).join('')+'</div>';tasks.forEach(t=>{let a=data[t.id],b=before?.[t.id],start=Math.round((a.start-new Date(base+'T00:00:00'))/86400000)+2;let cols=`${start} / span ${a.days}`;let changed=current&&(a.shift>0||t.id===current.id);html+=`<div class="task ${changed?'affected-row':''}"><div class="label"><b>${t.name}</b><small>${t.company}</small><br><span class="status">${t.status}</span></div>${b?`<div class="bar before" style="grid-column:${Math.round((b.start-new Date(base+'T00:00:00'))/86400000)+2} / span ${b.days}"></div>`:''}<div class="bar current ${changed?'affected':''}" style="--c:${t.color};grid-column:${cols}"><span>${changed?'候補':''}</span></div></div>`});document.getElementById('chart').innerHTML=html;document.getElementById('finish').textContent=fmt(data.interior.end);}
function simulate(){let id=document.getElementById('taskSelect').value,n=Math.max(1,Number(document.getElementById('delay').value)||1);let after=schedule(id,n),before=schedule(),affected=tasks.filter(t=>after[t.id].shift>0||t.id===id);current={id,n,before,after};let names=affected.filter(t=>t.id!==id).map(t=>t.name);let finishShift=Math.round((after.interior.end-before.interior.end)/86400000);document.getElementById('summary').innerHTML=`<b>再計算結果</b><br>「${tasks.find(t=>t.id===id).name}」の完了が${n}日遅れたため、${names.join('、')}の開始候補を${n}日後ろへ変更しました。全体の完了予定日は${finishShift}日後ろ倒しになります。`;document.getElementById('summary').classList.add('show');document.getElementById('compare').classList.add('show');document.getElementById('changes').innerHTML=affected.map(t=>{let b=before[t.id],a=after[t.id];return `<tr><td><b>${t.name}</b><br><small>${t.company}</small></td><td>${fmt(b.start)}〜${fmt(b.end)}</td><td>${fmt(a.start)}〜${fmt(a.end)}</td><td class="shift">${t.id===id?'所要日数 +'+n+'日':'開始 +'+a.shift+'日'}</td><td><button onclick="this.textContent='確認済み';this.style.background='#dff3ea'">候補を確認</button></td></tr>`}).join('');render()}
tasks.forEach(t=>document.getElementById('taskSelect').insertAdjacentHTML('beforeend',`<option value="${t.id}">${t.name}（${t.company}）</option>`));document.getElementById('taskSelect').value='foundation';document.getElementById('simulate').onclick=simulate;document.getElementById('reset').onclick=()=>{current=null;document.getElementById('summary').classList.remove('show');document.getElementById('compare').classList.remove('show');render()};render();
</script></body></html>
