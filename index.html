<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>現場フロー｜工事工程表</title>
  <meta name="description" content="建設工事の工程作成と遅延影響の再計算を行う工程表">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231b2a3a'/%3E%3Cpath d='M7 10h18M7 16h18M7 22h18' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M11 7v18M21 7v18' stroke='%23ee6a3b' stroke-width='2'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#17212c;--muted:#65707c;--paper:#f3f3f0;--surface:#fff;--line:#d8dcd9;--axis:#242a2d;--accent:#e9693a;--day:42px;--ease:cubic-bezier(.2,.8,.2,1)}
    *{box-sizing:border-box}html{font-size:16px}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}button,input,select{font:inherit}button{cursor:pointer}
    .appbar{height:62px;background:#fff;border-bottom:1px solid #cfd4d2;display:flex;align-items:center;padding:0 max(18px,calc((100% - 1240px)/2));gap:24px;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.05em;white-space:nowrap}.brandmark{width:28px;height:28px;background:var(--axis);border-radius:4px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:6px}.brandmark i{background:#fff}.brandmark i:nth-child(2){background:var(--accent)}.tabs{display:flex;align-self:stretch;margin-left:auto}.tabs button{border:0;border-bottom:3px solid transparent;background:transparent;padding:0 18px;color:#69737c;font-weight:700}.tabs button.active{color:var(--ink);border-color:var(--accent)}
    main{max-width:1240px;margin:auto;padding:26px 18px 56px}.pagehead{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:18px}.pagehead h1{margin:0;font-size:1.65rem;letter-spacing:.02em}.pagehead p{margin:7px 0 0;color:var(--muted);font-size:.9rem}.project-code{font:700 .78rem ui-monospace,monospace;color:#69737c;letter-spacing:.08em}.hidden{display:none!important}
    .panel{background:var(--surface);border:1px solid var(--line)}.section-title{display:flex;align-items:center;gap:10px;font-size:1rem;margin:0}.section-no{display:grid;place-items:center;width:25px;height:25px;background:var(--axis);color:#fff;font-size:.78rem;border-radius:50%}
    .project-form{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:18px;padding:18px 20px;border-bottom:0}.field label{display:block;font-size:.78rem;color:#5f6973;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;height:40px;border:1px solid #c9cfcc;border-radius:3px;background:#fff;padding:0 10px;color:var(--ink);outline:0}.field input:focus,.field select:focus{border-color:#59636a;box-shadow:0 0 0 2px #17212c14}
    .editor{overflow:hidden}.editor-head{min-height:58px;padding:0 18px;background:#eceeeb;border-bottom:1px solid #ccd1ce;display:flex;align-items:center;justify-content:space-between}.btn{height:40px;border:1px solid #bcc3c0;border-radius:3px;background:#fff;color:var(--ink);padding:0 15px;font-weight:700}.btn:hover{background:#f5f6f4}.btn.primary{border-color:var(--accent);background:var(--accent);color:#fff}.btn.primary:hover{background:#d95d32}.btn.dark{border-color:var(--axis);background:var(--axis);color:#fff}.process-head,.process-row{display:grid;grid-template-columns:36px 1.25fr 1.2fr .55fr 1fr 1fr .75fr 40px;gap:8px;align-items:center}.process-head{padding:10px 14px;background:#fafafa;border-bottom:1px solid var(--line);color:#66717b;font-size:.72rem;font-weight:800}.process-row{padding:10px 14px;border-bottom:1px solid #e5e8e5;transition:background .2s}.process-row:hover{background:#fbfbf9}.order{font:700 .78rem ui-monospace,monospace;color:#7b858d}.process-row input,.process-row select{height:38px;border:1px solid transparent;background:transparent;border-radius:2px;padding:0 7px;width:100%}.process-row:hover input,.process-row:hover select,.process-row input:focus,.process-row select:focus{background:#fff;border-color:#cbd0cd}.remove{width:34px;height:34px;border:0;background:transparent;color:#8b4c3c;font-size:1.2rem}.remove:hover{background:#f8e9e4}.editor-actions{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;background:#fafafa}.editor-note{margin:0;color:#717b84;font-size:.78rem}
    .gantt-tools{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;margin-bottom:14px}.delay-strip{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);padding:10px 12px}.delay-strip strong{font-size:.9rem;margin-right:6px}.delay-strip select{min-width:180px}.delay-strip input{width:72px}.delay-strip select,.delay-strip input{height:38px;border:1px solid #c8cecb;border-radius:3px;padding:0 9px;background:#fff}.finish-box{min-width:170px;padding:9px 16px;background:var(--axis);color:#fff;display:flex;flex-direction:column;justify-content:center}.finish-box small{font-size:.7rem;color:#bbc2c4}.finish-box b{font-size:1.25rem;letter-spacing:.04em;margin-top:2px}
    .schedule{position:relative;background:#fff;border:1px solid var(--line);overflow:hidden}.schedule-head{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line)}.schedule-head h2{font-size:.95rem;margin:0}.legend{font-size:.75rem;color:#69737b;display:flex;gap:15px}.legend i{display:inline-block;width:20px;height:5px;margin-right:5px;vertical-align:middle}.legend .solid{background:var(--accent)}.legend .ghost{background:#92999b;opacity:.35}.timeline-scroll{overflow-x:auto;overscroll-behavior-x:contain}.timeline{position:relative;height:510px;min-width:100%;background:linear-gradient(#fff,#fdfdfb)}.timeline::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(var(--day) - 1px),#eceeeb calc(var(--day) - 1px),#eceeeb var(--day));pointer-events:none}.axis{position:absolute;left:0;right:0;top:232px;height:50px;background:linear-gradient(#333a3d,#22282b);box-shadow:0 5px 10px #1a20242e;display:flex;z-index:4}.day{width:var(--day);flex:0 0 var(--day);height:50px;color:#e5e9e9;border-right:1px solid #4b5255;text-align:center;padding-top:8px;font:700 .72rem ui-monospace,monospace}.day small{display:block;font-size:.62rem;color:#aeb6b8;margin-top:3px}.day.weekend{color:#f3b099}.month-label{position:absolute;top:203px;left:14px;color:#5e686f;font-size:.75rem;font-weight:800;z-index:5}.taskbar,.oldbar{position:absolute;height:30px;border-radius:4px;z-index:7;color:#fff;overflow:hidden;white-space:nowrap}.taskbar{background:var(--color);box-shadow:0 3px 7px #27323826}.taskbar .barname{display:block;padding:7px 10px;font-size:.72rem;font-weight:800;line-height:1}.taskbar .duration{position:absolute;right:8px;top:7px;font:700 .65rem ui-monospace,monospace;opacity:.86}.taskbar.initial{animation:barEnter .55s var(--ease) both;animation-delay:var(--delay)}.taskbar.shifted{animation:barShift .9s var(--ease) both}.taskbar.expanded{animation:barExpand .9s var(--ease) both}.taskbar.changed{outline:2px solid #fff;box-shadow:0 0 0 4px #e9693a59,0 6px 14px #27323838}.oldbar{height:30px;background:#7c8588;opacity:.18;border:1px dashed #333;z-index:5}.connector{position:absolute;width:1px;background:var(--color);opacity:.65;z-index:3}.marker{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--color);border:2px solid #fff;box-shadow:0 0 0 1px var(--color);z-index:8}.taskmeta{position:absolute;color:#47515a;font-size:.68rem;font-weight:700;z-index:6;white-space:nowrap}.taskmeta small{display:block;color:#858e94;font-weight:500;margin-top:2px}.taskmeta.changed{color:#bd4e28}.schedule.updating::after{content:"再計算中";position:absolute;inset:0;background:#fff9;display:grid;place-items:center;z-index:15;color:#354047;font-weight:800;letter-spacing:.12em;animation:veil .42s both}
    .result{display:none;margin-top:12px;border-left:4px solid var(--accent);background:#fff;padding:14px 16px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:.88rem;line-height:1.65}.result.show{display:block;animation:resultIn .45s var(--ease) both}.result strong{display:block;margin-bottom:2px}.comparison{display:none;margin-top:14px;background:#fff;border:1px solid var(--line)}.comparison.show{display:block;animation:resultIn .45s var(--ease) both}.comparison h2{font-size:.95rem;margin:0;padding:15px 16px;border-bottom:1px solid var(--line)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 15px;border-bottom:1px solid #e4e7e4;font-size:.82rem}th{background:#f4f5f3;color:#626d75;font-size:.72rem}.shift{color:#c14d26;font-weight:800}.loading-label{display:none}.processing .button-label{display:none}.processing .loading-label{display:inline}.processing{pointer-events:none;opacity:.8}
    @keyframes barEnter{from{opacity:0;transform:scaleX(.25);transform-origin:left}to{opacity:1;transform:scaleX(1)}}@keyframes barShift{0%{transform:translateX(calc(-1 * var(--shift)));filter:saturate(.4)}65%{transform:translateX(4px)}100%{transform:translateX(0);filter:saturate(1)}}@keyframes barExpand{from{width:var(--old-width)}to{width:var(--new-width)}}@keyframes resultIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}@keyframes veil{0%{opacity:0}45%{opacity:1}100%{opacity:0}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;scroll-behavior:auto!important}}
    @media(max-width:880px){.process-head{display:none}.process-row{grid-template-columns:32px 1fr 1fr}.process-row>*:nth-child(n+4){grid-column:auto}.project-form{grid-template-columns:1fr}.gantt-tools{grid-template-columns:1fr}.finish-box{min-height:58px}.timeline{height:500px}.delay-strip{flex-wrap:wrap}.editor-note{display:none}}
    @media(max-width:580px){.appbar{height:auto;min-height:60px;align-items:flex-start;flex-direction:column;gap:8px;padding:12px}.tabs{width:100%;height:42px}.tabs button{flex:1;padding:0 6px;font-size:.82rem}main{padding:18px 10px 40px}.pagehead{display:block}.project-code{margin-top:8px}.project-form{padding:14px}.process-row{grid-template-columns:28px 1fr}.process-row>*{grid-column:2}.process-row .order{grid-column:1;grid-row:1}.process-row .remove{grid-column:1;grid-row:2}.editor-actions{gap:8px}.editor-actions .btn{flex:1;padding:0 7px;font-size:.78rem}.delay-strip strong{width:100%}.delay-strip select{min-width:0;flex:1}.schedule-head{align-items:flex-start;height:auto;padding:13px;gap:8px;flex-direction:column}.legend{margin-bottom:3px}.comparison{overflow-x:auto}table{min-width:620px}}
  </style>
</head>
<body>
  <header class="appbar"><div class="brand"><span class="brandmark" aria-hidden="true"><i></i><i></i><i></i></span>現場フロー</div><nav class="tabs" aria-label="画面切り替え"><button id="createTab" class="active">工程を作成</button><button id="ganttTab">工程表・遅延調整</button></nav></header>
  <main>
    <section id="createPanel">
      <div class="pagehead"><div><h1>工程表を作成</h1><p>現場情報と工程の前後関係を登録します。</p></div><div class="project-code">NEW SCHEDULE / 01</div></div>
      <div class="panel project-form"><div class="field"><label for="projectName">現場名</label><input id="projectName" value="木造住宅 新築工事"></div><div class="field"><label for="projectStart">工事開始日</label><input id="projectStart" type="date" value="2026-08-01"></div><div class="field"><label for="manager">管理担当者</label><input id="manager" value="現場監督"></div></div>
      <section class="panel editor"><div class="editor-head"><h2 class="section-title"><span class="section-no">1</span>工程を登録</h2><button class="btn" id="addProcess">＋ 工程を追加</button></div><div class="process-head"><span>No.</span><span>工程名</span><span>工種・担当会社</span><span>所要日数</span><span>前提工程</span><span>稼働不可日</span><span>進捗</span><span></span></div><div id="processList"></div><div class="editor-actions"><p class="editor-note">前提工程を指定すると、完了日の後に自動配置されます。</p><div><button class="btn" id="resetBuilder">初期データ</button> <button class="btn dark" id="generate">工程表を生成</button></div></div></section>
    </section>
    <section id="ganttPanel" class="hidden">
      <div class="pagehead"><div><h1 id="ganttTitle">工事工程表</h1><p id="projectMeta"></p></div><div class="project-code">MASTER SCHEDULE / 01</div></div>
      <div class="gantt-tools"><div class="delay-strip"><strong>遅延を反映</strong><select id="taskSelect" aria-label="遅れが出た工程"></select><input id="delay" type="number" min="1" max="30" value="2" aria-label="遅れ日数"><span>日</span><button class="btn primary" id="simulate"><span class="button-label">変更を反映</span><span class="loading-label">再計算中…</span></button><button class="btn" id="backToEdit">工程を編集</button></div><div class="finish-box"><small>全体完了予定</small><b id="finish"></b></div></div>
      <section class="schedule" id="scheduleBoard"><div class="schedule-head"><h2>全体工程</h2><div class="legend"><span><i class="ghost"></i>変更前</span><span><i class="solid"></i>変更後・影響あり</span></div></div><div class="timeline-scroll"><div id="timeline" class="timeline"></div></div></section>
      <div id="summary" class="result" aria-live="polite"></div><section id="compare" class="comparison"><h2>変更前後の比較</h2><table><thead><tr><th>工程</th><th>変更前</th><th>変更後</th><th>影響</th></tr></thead><tbody id="changes"></tbody></table></section>
    </section>
  </main>
  <script>
    const $=id=>document.getElementById(id), DAY=42, palette=['#2b8b62','#e89419','#17658a','#b3263e','#536e80','#7d5b9c','#367b83'];
    const defaults=[{name:'土木工事',company:'土木業者',days:4,dep:'',blocked:'',status:'完了'},{name:'基礎工事',company:'基礎業者',days:3,dep:'0',blocked:'8/6',status:'進行中'},{name:'躯体工事',company:'大工・建方業者',days:7,dep:'1',blocked:'',status:'未着手'},{name:'電気配線',company:'電気業者',days:4,dep:'2',blocked:'',status:'未着手'},{name:'内装工事',company:'内装業者',days:5,dep:'3',blocked:'',status:'未着手'}];
    let tasks=structuredClone(defaults),base=new Date('2026-08-01T00:00:00'),current=null;
    const add=(date,n)=>{const x=new Date(date);x.setDate(x.getDate()+n);return x},fmt=date=>`${date.getMonth()+1}/${date.getDate()}`,esc=value=>String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function show(view){$('createPanel').classList.toggle('hidden',view!=='create');$('ganttPanel').classList.toggle('hidden',view!=='gantt');$('createTab').classList.toggle('active',view==='create');$('ganttTab').classList.toggle('active',view==='gantt')}
    function builderRow(task,index){const deps='<option value="">なし</option>'+tasks.slice(0,index).map((item,i)=>`<option value="${i}" ${String(task.dep)===String(i)?'selected':''}>${esc(item.name||`工程 ${i+1}`)}</option>`).join(''),statuses=['未着手','進行中','完了','遅延'].map(s=>`<option ${s===task.status?'selected':''}>${s}</option>`).join('');return `<div class="process-row" data-index="${index}"><span class="order">${String(index+1).padStart(2,'0')}</span><input data-key="name" aria-label="工程名" value="${esc(task.name)}"><input data-key="company" aria-label="工種・担当会社" value="${esc(task.company)}"><input data-key="days" aria-label="所要日数" type="number" min="1" value="${task.days}"><select data-key="dep" aria-label="前提工程">${deps}</select><input data-key="blocked" aria-label="稼働不可日" placeholder="8/6, 8/10" value="${esc(task.blocked)}"><select data-key="status" aria-label="進捗">${statuses}</select><button class="remove" aria-label="この工程を削除">×</button></div>`}
    function renderBuilder(){$('processList').innerHTML=tasks.map(builderRow).join('');document.querySelectorAll('.process-row').forEach(row=>{const index=Number(row.dataset.index);row.querySelectorAll('[data-key]').forEach(control=>control.addEventListener('change',()=>{tasks[index][control.dataset.key]=control.dataset.key==='days'?Math.max(1,Number(control.value)||1):control.value;renderBuilder()}));row.querySelector('.remove').addEventListener('click',()=>removeTask(index))})}
    function removeTask(index){if(tasks.length===1)return;tasks.splice(index,1);tasks.forEach(task=>{if(task.dep==='')return;const d=Number(task.dep);task.dep=d===index?'':String(d>index?d-1:d)});renderBuilder()}
    function schedule(delayId=-1,extra=0){const result=[];tasks.forEach((task,index)=>{const start=task.dep!==''&&result[Number(task.dep)]?add(result[Number(task.dep)].end,0):new Date(base),days=Number(task.days)+(index===delayId?extra:0);result.push({start,end:add(start,days),days,shift:0})});if(delayId>=0){const original=schedule();result.forEach((item,index)=>item.shift=Math.round((item.start-original[index].start)/864e5))}return result}
    function generateChart(){if(!$('projectStart').value)return;base=new Date(`${$('projectStart').value}T00:00:00`);current=null;$('ganttTitle').textContent=$('projectName').value||'工事工程表';$('projectMeta').textContent=`開始 ${fmt(base)} ・ 管理 ${$('manager').value||'未設定'}`;$('taskSelect').innerHTML=tasks.map((task,index)=>`<option value="${index}">${esc(task.name)}（${esc(task.company)}）</option>`).join('');$('taskSelect').value=String(Math.min(1,tasks.length-1));$('summary').className='result';$('compare').className='comparison';renderTimeline(false);show('gantt')}
    function taskLayout(index){const above=index%2===0,row=Math.floor(index/2);return above?{bar:28+row*67,meta:61+row*67}:{bar:320+row*67,meta:354+row*67}}
    function renderTimeline(animate){const data=current?current.after:schedule(),before=current?current.before:null,lastEnd=Math.max(...data.map(x=>x.end.getTime())),total=Math.max(28,Math.ceil((lastEnd-base)/864e5)+3),width=total*DAY;let html=`<div class="month-label">${base.getFullYear()}年 ${base.getMonth()+1}月</div><div class="axis" style="width:${width}px">`;for(let i=0;i<total;i++){const date=add(base,i),week=['日','月','火','水','木','金','土'][date.getDay()];html+=`<div class="day ${date.getDay()===0||date.getDay()===6?'weekend':''}">${date.getDate()}<small>${week}</small></div>`}html+='</div>';
      tasks.forEach((task,index)=>{const item=data[index],old=before&&before[index],start=Math.round((item.start-base)/864e5),oldStart=old?Math.round((old.start-base)/864e5):start,layout=taskLayout(index),color=palette[index%palette.length],changed=Boolean(current&&(index===current.id||item.shift>0)),barWidth=Math.max(item.days*DAY-5,34),oldWidth=old?Math.max(old.days*DAY-5,34):barWidth,markerTop=layout.bar<232?227:277,connTop=Math.min(layout.bar+15,257),connHeight=Math.abs(247-(layout.bar+15));if(changed&&old)html+=`<div class="oldbar" style="left:${oldStart*DAY+3}px;top:${layout.bar}px;width:${oldWidth}px"></div>`;html+=`<div class="connector" style="--color:${color};left:${start*DAY+11}px;top:${connTop}px;height:${connHeight}px"></div><div class="marker" style="--color:${color};left:${start*DAY+6}px;top:${markerTop}px"></div>`;const motion=animate&&changed?(item.shift>0?'shifted':'expanded'):'initial';html+=`<div class="taskbar ${motion} ${changed?'changed':''}" style="--color:${color};--shift:${item.shift*DAY}px;--old-width:${oldWidth}px;--new-width:${barWidth}px;--delay:${index*.06}s;left:${start*DAY+3}px;top:${layout.bar}px;width:${barWidth}px"><span class="barname">${esc(task.name)}</span><span class="duration">${item.days}日</span></div><div class="taskmeta ${changed?'changed':''}" style="left:${start*DAY+4}px;top:${layout.meta}px">${esc(task.company)}<small>${fmt(item.start)} — ${fmt(item.end)}</small></div>`});$('timeline').style.width=`${width}px`;$('timeline').innerHTML=html;$('finish').textContent=fmt(new Date(lastEnd))}
    function simulate(){const id=Number($('taskSelect').value),days=Math.max(1,Number($('delay').value)||1),button=$('simulate');button.classList.add('processing');$('scheduleBoard').classList.add('updating');setTimeout(()=>{const before=schedule(),after=schedule(id,days);current={id,days,before,after};const affected=tasks.map((task,index)=>({task,index})).filter(({index})=>index!==id&&after[index].shift>0),finishShift=Math.round((Math.max(...after.map(x=>x.end))-Math.max(...before.map(x=>x.end)))/864e5);renderTimeline(true);$('summary').innerHTML=`<strong>日程変更案</strong>「${esc(tasks[id].name)}」の完了が${days}日遅れるため、${affected.length?affected.map(x=>esc(x.task.name)).join('、'):'後続工程なし'}の開始候補を再計算しました。全体の完了予定は<strong style="display:inline">${finishShift}日後ろ倒し</strong>です。`;$('summary').className='result show';$('changes').innerHTML=tasks.map((task,index)=>({task,index})).filter(({index})=>index===id||after[index].shift>0).map(({task,index})=>`<tr><td><b>${esc(task.name)}</b><br><small>${esc(task.company)}</small></td><td>${fmt(before[index].start)}〜${fmt(before[index].end)}</td><td>${fmt(after[index].start)}〜${fmt(after[index].end)}</td><td class="shift">${index===id?`所要日数 +${days}日`:`開始 +${after[index].shift}日`}</td></tr>`).join('');$('compare').className='comparison show';button.classList.remove('processing');setTimeout(()=>$('scheduleBoard').classList.remove('updating'),80)},420)}
    $('createTab').addEventListener('click',()=>show('create'));$('ganttTab').addEventListener('click',generateChart);$('backToEdit').addEventListener('click',()=>show('create'));$('generate').addEventListener('click',generateChart);$('simulate').addEventListener('click',simulate);$('addProcess').addEventListener('click',()=>{tasks.push({name:'新しい工程',company:'担当会社',days:1,dep:tasks.length?String(tasks.length-1):'',blocked:'',status:'未着手'});renderBuilder()});$('resetBuilder').addEventListener('click',()=>{tasks=structuredClone(defaults);$('projectStart').value='2026-08-01';$('projectName').value='木造住宅 新築工事';$('manager').value='現場監督';renderBuilder()});renderBuilder();
  </script>
</body>
</html>
