<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>現場フロー｜工程表作成・自動再調整</title><style>
:root{--ink:#182235;--muted:#687486;--line:#dbe2ea;--bg:#f4f6f8;--navy:#18304b;--orange:#ef6b3b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}header{background:var(--navy);color:#fff;padding:14px max(16px,calc((100% - 1180px)/2));display:flex;justify-content:space-between;align-items:center}header strong{font-size:20px}.nav{display:flex;gap:5px;background:#10273e;padding:4px;border-radius:10px}.nav button{border:0;color:#cbd8e5;background:transparent;padding:9px 14px;border-radius:7px;font-weight:700}.nav button.active{background:#fff;color:var(--navy)}main{max-width:1180px;margin:auto;padding:24px 18px 48px}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.08em;color:#56718c}.head h1{font-size:28px;margin:5px 0}.head p,.hint{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 7px #12223a08}.hidden{display:none!important}.builder{display:grid;grid-template-columns:280px 1fr;gap:18px}.side,.delay{padding:18px}.side h2,.delay h2{font-size:17px;margin:0 0 14px}.field{margin:13px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:#485568}input,select{width:100%;padding:10px;border:1px solid #cbd4df;border-radius:8px;background:#fff;font-size:15px}.steps{display:flex;gap:7px;margin:18px 0}.steps i{flex:1;height:5px;border-radius:5px;background:#dce3ea}.steps .on{background:var(--orange)}.hint{font-size:12px;line-height:1.55}.editor{overflow:hidden}.editor-head{padding:18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.editor-head h2{font-size:17px;margin:4px 0 0}.add{border:1px solid #c3ced9;background:#f6f9fb;padding:9px 12px;border-radius:8px;font-weight:700}.list{padding:12px}.process{display:grid;grid-template-columns:1.3fr 1.2fr .55fr 1fr 1fr .8fr 38px;gap:8px;padding:10px;border-bottom:1px solid #edf0f3;align-items:end}.process label{display:block;font-size:11px;font-weight:700;color:#6a7485;margin-bottom:5px}.remove{height:38px;border:0;border-radius:8px;background:#fff0eb;color:#be4e2b;font-weight:800}.actions{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}button{cursor:pointer;font:inherit}.primary{border:0;background:var(--orange);color:#fff;padding:12px 17px;border-radius:9px;font-weight:800}.secondary{border:0;background:#eaf0f6;color:#263d55;padding:12px 15px;border-radius:9px;font-weight:700}.grid{display:grid;grid-template-columns:310px 1fr;gap:18px}.row{display:grid;grid-template-columns:1fr 35px;gap:8px;align-items:center}.wide{width:100%;margin-top:8px}.summary{display:none;background:#fff4ee;border:1px solid #ffcbb7;border-radius:10px;padding:13px;line-height:1.55;margin-top:15px;font-size:14px}.summary.show{display:block}.finish{padding:12px 17px;min-width:175px}.finish small{color:var(--muted)}.finish b{display:block;font-size:23px}.chart-card{overflow:hidden}.chart-head{padding:17px 18px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}.chart-head h2{font-size:16px;margin:0}.legend{font-size:12px;color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:2px;background:#b5bdc7;margin:0 4px 0 10px}.dot.after{background:var(--orange)}.scroll{overflow-x:auto}.chart{min-width:770px}.axis,.taskrow{display:grid;grid-template-columns:190px repeat(28,24px);min-height:53px;border-bottom:1px solid #edf0f3}.axis{min-height:62px;background:#fafbfc}.axis>div{font-size:11px;color:#687486;text-align:center;padding-top:12px;border-left:1px solid #eef1f4}.label{text-align:left!important;padding:10px 12px!important;background:#fff;border-right:1px solid #e8edf1;z-index:2}.label b{font-size:14px}.label small{font-size:12px;color:var(--muted)}.status{display:inline-block;background:#edf1f5;color:#586574;border-radius:10px;padding:3px 7px;font-size:11px;margin-top:3px}.bar{grid-row:1;margin:13px 1px;border-radius:5px;z-index:1}.bar.before{opacity:.28;background:#7d8898}.bar.current{background:var(--c)}.bar.affected{background:var(--orange);box-shadow:0 0 0 2px #ffae8e}.affected-row,.affected-row .label{background:#fffaf7}.compare{display:none;margin-top:18px}.compare.show{display:block}.compare h2{font-size:18px}.changes{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line)}.changes th,.changes td{padding:11px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}.changes th{background:#f8fafb;font-size:12px}.shift{color:#c34b25;font-weight:700}@media(max-width:900px){.builder,.grid{grid-template-columns:1fr}.process{grid-template-columns:1fr 1fr}.chart-card{order:-1}}@media(max-width:560px){header{align-items:flex-start;flex-direction:column;gap:10px}.nav{width:100%}.nav button{flex:1;font-size:13px;padding:8px 5px}main{padding:17px 10px}.head{display:block}.finish{margin-top:12px}.process{grid-template-columns:1fr}}
</style></head><body><header><strong>現場フロー</strong><nav class="nav"><button id="createTab" class="active">工程表を作る</button><button id="ganttTab">工程表を見る・調整</button></nav></header><main>
<section id="createPanel"><div class="head"><div><div class="eyebrow">STEP 1　新しい現場を登録</div><h1>工程表を作る</h1><p>現場の基本情報と、工種ごとの順番を入力します。</p></div></div><div class="builder"><aside class="card side"><h2>現場の基本情報</h2><div class="field"><label>現場名</label><input id="projectName" value="木造住宅 新築工事"></div><div class="field"><label>工事開始日</label><input id="projectStart" type="date" value="2026-08-01"></div><div class="field"><label>管理担当者</label><input id="manager" value="現場監督"></div><div class="steps"><i class="on"></i><i class="on"></i><i></i></div><p class="hint">工程は上から順に並びます。前提工程を指定すると、その工程が終わった日から次の工程を自動配置します。</p></aside><section class="card editor"><div class="editor-head"><div><div class="eyebrow">STEP 2</div><h2>工程を登録する</h2></div><button class="add" id="addProcess">＋ 工程を追加</button></div><div id="processList" class="list"></div><div class="actions"><button class="secondary" id="resetBuilder">初期データに戻す</button><button class="primary" id="generate">工程表を生成 →</button></div></section></div></section>
<section id="ganttPanel" class="hidden"><div class="head"><div><div class="eyebrow">工程の遅延影響を見える化</div><h1 id="ganttTitle">工事工程表</h1><p>依存関係をもとに、後続工程の開始候補を再計算します。</p></div><div class="card finish"><small>完了予定（現在案）</small><b id="finish"></b></div></div><div class="grid"><aside class="card delay"><h2>1. 遅れを入力する</h2><div class="field"><label>遅れが出た工程</label><select id="taskSelect"></select></div><div class="field"><label>遅れ日数</label><div class="row"><input id="delay" type="number" min="1" max="30" value="2"><span>日</span></div></div><button class="primary wide" id="simulate">影響を見る</button><button class="secondary wide" id="backToEdit">工程を編集する</button><p class="hint">候補日程は、協力会社の稼働・天候・資材納入を確認したうえで確定してください。</p><div id="summary" class="summary"></div></aside><section class="card chart-card"><div class="chart-head"><h2>2. 影響を確認する</h2><div class="legend"><i class="dot"></i>変更前 <i class="dot after"></i>影響あり</div></div><div class="scroll"><div id="chart" class="chart"></div></div></section></div><section id="compare" class="compare"><h2>3. 変更候補の比較</h2><table class="changes"><thead><tr><th>工程</th><th>変更前</th><th>変更後</th><th>影響</th></tr></thead><tbody id="changes"></tbody></table></section></section></main><script>
const palette=['#3a9b75','#2e78c8','#8268c5','#d7a23d','#ef6b3b','#3c8791','#a45a82'],defaults=[{name:'土木工事',company:'土木業者',days:4,dep:'',blocked:'',status:'完了'},{name:'基礎工事',company:'基礎業者',days:3,dep:'0',blocked:'8/6',status:'進行中'},{name:'躯体工事',company:'大工・建方業者',days:7,dep:'1',blocked:'',status:'未着手'},{name:'電気配線',company:'電気業者',days:4,dep:'2',blocked:'',status:'未着手'},{name:'内装工事',company:'内装業者',days:5,dep:'3',blocked:'',status:'未着手'}];let tasks=structuredClone(defaults),base=new Date('2026-08-01T00:00:00'),current=null;const add=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x},fmt=d=>`${d.getMonth()+1}/${d.getDate()}`;
function show(w){createPanel.classList.toggle('hidden',w!=='create');ganttPanel.classList.toggle('hidden',w!=='gantt');createTab.classList.toggle('active',w==='create');ganttTab.classList.toggle('active',w==='gantt')}createTab.onclick=()=>show('create');ganttTab.onclick=()=>generateChart();backToEdit.onclick=()=>show('create');
function row(t,i){let deps='<option value="">なし</option>'+tasks.slice(0,i).map((x,j)=>`<option value="${j}" ${String(t.dep)===String(j)?'selected':''}>${x.name||'工程'+(j+1)}</option>`).join('');return `<div class="process" data-i="${i}"><div><label>工程名</label><input data-k="name" value="${t.name}"></div><div><label>工種・担当会社</label><input data-k="company" value="${t.company}"></div><div><label>所要日数</label><input data-k="days" type="number" min="1" value="${t.days}"></div><div><label>前提工程</label><select data-k="dep">${deps}</select></div><div><label>稼働不可日</label><input data-k="blocked" placeholder="8/6, 8/10" value="${t.blocked}"></div><div><label>進捗</label><select data-k="status">${['未着手','進行中','完了','遅延'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></div><button class="remove" aria-label="削除">×</button></div>`}function renderBuilder(){processList.innerHTML=tasks.map(row).join('');processList.querySelectorAll('.process').forEach(r=>{let i=+r.dataset.i;r.querySelectorAll('[data-k]').forEach(el=>el.onchange=()=>{tasks[i][el.dataset.k]=el.dataset.k==='days'?Math.max(1,+el.value):el.value;renderBuilder()});r.querySelector('.remove').onclick=()=>{if(tasks.length>1){tasks.splice(i,1);tasks.forEach((t,j)=>{if(t.dep!==''&&+t.dep>=i)t.dep=j?String(j-1):''});renderBuilder()}}})}addProcess.onclick=()=>{tasks.push({name:'新しい工程',company:'担当会社',days:1,dep:tasks.length?String(tasks.length-1):'',blocked:'',status:'未着手'});renderBuilder()};resetBuilder.onclick=()=>{tasks=structuredClone(defaults);projectStart.value='2026-08-01';projectName.value='木造住宅 新築工事';renderBuilder()};generate.onclick=()=>generateChart();
function schedule(id=-1,extra=0){let out=[];tasks.forEach((t,i)=>{let s=t.dep!==''&&out[+t.dep]?add(out[+t.dep].end,0):new Date(base),days=+t.days+(i===id?extra:0);out.push({start:s,end:add(s,days),days,shift:0})});if(id>=0){let p=schedule();out.forEach((x,i)=>x.shift=Math.round((x.start-p[i].start)/864e5))}return out}function generateChart(){base=new Date(projectStart.value+'T00:00:00');ganttTitle.textContent=projectName.value||'工事工程表';current=null;summary.className='summary';compare.className='compare';taskSelect.innerHTML=tasks.map((t,i)=>`<option value="${i}">${t.name}（${t.company}）</option>`).join('');taskSelect.value=Math.min(1,tasks.length-1);renderChart();show('gantt')}
function renderChart(){let data=current?current.after:schedule(),before=current&&current.before,total=Math.max(28,Math.ceil((data.at(-1).end-base)/864e5)+4),dates=Array.from({length:total},(_,i)=>{let d=add(base,i);return `${fmt(d)}<br><small>${['日','月','火','水','木','金','土'][d.getDay()]}</small>`});let h=`<div class="axis" style="grid-template-columns:190px repeat(${total},24px)"><div class="label">工程 / 担当<br><small>開始：${fmt(base)}</small></div>${dates.map(d=>`<div>${d}</div>`).join('')}</div>`;tasks.forEach((t,i)=>{let a=data[i],b=before&&before[i],p=Math.round((a.start-base)/864e5)+2,hit=current&&(a.shift>0||i===current.id);h+=`<div class="taskrow ${hit?'affected-row':''}" style="grid-template-columns:190px repeat(${total},24px)"><div class="label"><b>${t.name}</b><br><small>${t.company}</small><br><span class="status">${t.status}</span></div>${b?`<div class="bar before" style="grid-column:${Math.round((b.start-base)/864e5)+2} / span ${b.days}"></div>`:''}<div class="bar current ${hit?'affected':''}" style="--c:${palette[i%palette.length]};grid-column:${p} / span ${a.days}"></div></div>`});chart.innerHTML=h;finish.textContent=fmt(data.at(-1).end)}simulate.onclick=()=>{let id=+taskSelect.value,n=Math.max(1,+delay.value||1),before=schedule(),after=schedule(id,n);current={id,before,after};let affected=tasks.filter((_,i)=>i!==id&&after[i].shift>0).map(t=>t.name),shift=Math.round((after.at(-1).end-before.at(-1).end)/864e5);summary.innerHTML=`<b>再計算結果</b><br>「${tasks[id].name}」の完了が${n}日遅れたため、${affected.join('、')||'後続工程なし'}の開始候補を調整しました。全体の完了予定日は${shift}日後ろ倒しになります。`;summary.className='summary show';compare.className='compare show';changes.innerHTML=tasks.map((t,i)=>({t,i})).filter(x=>x.i===id||after[x.i].shift>0).map(({t,i})=>`<tr><td>${t.name}</td><td>${fmt(before[i].start)}〜${fmt(before[i].end)}</td><td>${fmt(after[i].start)}〜${fmt(after[i].end)}</td><td class="shift">${i===id?'所要日数 +'+n+'日':'開始 +'+after[i].shift+'日'}</td></tr>`).join('');renderChart()};renderBuilder();
</script></body></html>
